<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>CSS Border</title>
</head>
<body>
    <style>
        div {
            border: 2px solid #a1a1a1;
            padding: 10px 40px;
            background: #dddddd;
            width: 300px;
            border-radius: 25px;
        }
    </style>
    <div>The border-radius property allows you to add rounded corners to elements.</div>
</body>
</html>
