<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Text Effect</title>
</head>
<body>
    <style>
        h1 {
            text-shadow: 5px 5px 5px #ff0000;
        }
    </style>
    <h1>Text-shadow effect!</h1>
    <p><b>Note:</b> Internet Explorer 9 and earlier versions, does not 
        support the text shadow property.</p>
</body>
</html>
